[package]
name = "schema-registry-rust-consumer"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
build = "build.rs"
workspace = "../../../agent-trace/rust"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
regex = "1.12"

[build-dependencies]
schema-registry-rust = { path = ".." }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
