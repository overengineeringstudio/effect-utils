lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/app:
    dependencies:
      file-consumer:
        specifier: file:../../external/file-consumer
        version: file:external/file-consumer
      workspace-lib:
        specifier: workspace:*
        version: link:../lib

  packages/lib: {}

packages:

  file-consumer@file:external/file-consumer:
    resolution: {directory: external/file-consumer, type: directory}

snapshots:

  file-consumer@file:external/file-consumer:
    dependencies:
      workspace-lib: link:packages/lib
