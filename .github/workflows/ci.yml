name: '[tmp bench] B2 integer transport'
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  bench:
    runs-on: [namespace-profile-linux-x86-64, 'namespace-features:github.run-id=${{ github.run_id }}']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install isolated dependencies
        working-directory: tmp-bench-b2
        run: bun install --frozen-lockfile
      - name: Interleaved quiet-host measurements
        working-directory: tmp-bench-b2
        shell: bash
        run: |
          mkdir -p evidence
          node -e 'const os=require("os"); console.log(os.hostname(),os.loadavg()); if(os.loadavg()[0]>=20) process.exit(1)'
          nice -n 10 node bench.mjs
          nice -n 10 bun bench.mjs
          nice -n 10 node bench.mjs --safe
          nice -n 10 bun bench.mjs --safe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-quiet-bench
          path: tmp-bench-b2/evidence
