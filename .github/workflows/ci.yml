          if [ "${#span_files[@]}" -eq 0 ]; then
            echo "::notice::No CI OpenTelemetry task spans were emitted"
            exit 0
          fi
          {
            echo "## Slowest devenv tasks"
            echo ""
            echo "| Task | Duration | Status |"
            echo "| --- | ---: | --- |"
            while IFS=$'\t' read -r duration task status; do
              printf '| `%s` | %.2fs | %s |\n' "$task" "$duration" "$status"
            done < <(
              jq -s -r '
                [.[].resourceSpans[].scopeSpans[].spans[]
                  | select(.name == "devenv.task.exec")
                  | (.attributes | map({ key, value: (.value.stringValue // .value.intValue // .value.boolValue) }) | from_entries) as $attrs
                  | [
                      (((.endTimeUnixNano | tonumber) - (.startTimeUnixNano | tonumber)) / 1000000000),
                      ($attrs["task.name"] // $attrs["span.label"] // .name),
                      (if (.status.code // 0) == 2 then "error" else "ok" end)
                    ]
                  | @tsv
                ] | .[]
              ' "${span_files[@]}" | sort -nr | sed -n '1,20p'
            )
          } >> "$GITHUB_STEP_SUMMARY"
      - # v4.6.2
        name: Upload CI OpenTelemetry spans
        if: always() && env.OTEL_SPAN_SPOOL_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'ci-otel-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.OTEL_SPAN_SPOOL_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Collect Buck2 cache evidence
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}"
          nix shell .#bun .#buck2 --command bash genie/ci-scripts/collect-buck2-cache-evidence.sh
      - # v4.6.2
        name: Upload Buck2 cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'buck2-cache-evidence-quality-${{ github.run_attempt }}'
          path: |
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}
            ${{ env.CI_BUCK2_CACHE_ACTIONS_PATH }}
            ${{ env.CI_BUCK2_CACHE_WARM99_PATH }}
            ${{ env.CI_BUCK2_CACHE_PROOF_MANIFEST_PATH }}
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shard-index.json
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shards/*.json
          if-no-files-found: warn
          retention-days: 90
      - # v4.4.0
        if: ${{ (always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    needs: [tested-tree]
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && '0' || '1' }}
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: quality
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: pr/quality
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
      BUCK2_CACHE_WRITE_OPTIONAL: '1'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-quality"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  test:
    name: test (namespace-profile-linux-x86-64)
    if: ${{ !cancelled() && (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tested-tree.outputs.tested != 'true')) }}
    needs: [tested-tree]
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && '0' || '1' }}
      EFFECT_UTILS_CI_TEST: '1'
      EFFECT_UTILS_TEST_PLATFORM: linux
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: test
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: test (namespace-profile-linux-x86-64)
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
      BUCK2_CACHE_WRITE_OPTIONAL: '1'
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Prepare CI OpenTelemetry capture
        shell: bash
        run: |
          set -euo pipefail
          spool_dir="${{ runner.temp }}/composition-state/otel-spans"
          mkdir -p "$spool_dir"
          printf 'OTEL_SPAN_SPOOL_DIR=%s\n' "$spool_dir" >> "$GITHUB_ENV"
          printf 'OTEL_SPOOL_MULTI_WRITER=1\n' >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - id: linux-sandbox-admission
        name: Log Linux sandbox prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          BUCK2_TS_PRIVILEGE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$BUCK2_TS_PRIVILEGE_ALLOWED" != true ]; then
            echo "::error::Buck TypeScript lane refused: untrusted pull_request runs on an unprivileged Namespace runner; privileged Nix/Bubblewrap execution is not admitted (fork policy Q49 pending)." >&2
            exit 1
          fi
          nix config show | grep -E '^sandbox'
          for key in kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            if sysctl "$key"; then :; else printf "Unavailable sysctl: %s\n" "$key"; fi
          done
          unshare -Ur true
          echo "unshare -Ur true: passed"
      - # v6.1.0
        name: Checkout CI measurement baseline ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.measurement_baseline_ref }}
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: test
          MATRIX_VALUE: namespace-profile-linux-x86-64
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - name: Start Buck2 cache evidence window
        shell: bash
        run: |
          set -euo pipefail
          marker="${CI_BUCK2_CACHE_EVIDENCE_START:?cache evidence start not declared}"
          mkdir -p "${marker%/*}"
          started_at=$(( $(date +%s) * 1000 ))
          source_root=""
          fresh_root=0
          if source_root=$(cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}" && pwd -P); then
            if tracked_root=$(git -C "$source_root" rev-parse --show-toplevel 2>/dev/null) &&
               tracked_root=$(cd "$tracked_root" && pwd -P) &&
               [ "$tracked_root" = "$source_root" ] &&
               [ ! -e "$source_root/buck-out" ] && [ ! -L "$source_root/buck-out" ]; then
              fresh_root=1
            fi
          fi
          printf "%s\n%s\n%s\n" "$started_at" "$source_root" "$fresh_root" > "$marker"
          printf "CI_BUCK2_CACHE_EVIDENCE_STARTED_AT=%s\n" "$started_at" >> "$GITHUB_ENV"
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths nixpkgs#cachix)
          echo "$out/bin" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - # v17
        name: Enable Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          skipPush: true
      - name: Prepare CI helper scripts
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          scripts_src='genie/ci-scripts'
          scripts_dst='${{ runner.temp }}/composition-state/ci-runtime'
          if [ ! -d "$scripts_src" ]; then
            echo "::error::CI helper script directory is missing: $scripts_src"
            exit 1
          fi
          rm -rf "$scripts_dst"
          mkdir -p "$scripts_dst"
          cp -R "$scripts_src/." "$scripts_dst/"
          rm -f "$scripts_dst"/*.genie.ts
          chmod +x "$scripts_dst"/*.sh
      - name: Use pinned devenv from lock
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && DEVENV_REV=$(jq -r .nodes.devenv.locked.rev 'devenv.lock')
          if [ -z "$DEVENV_REV" ] || [ "$DEVENV_REV" = "null" ]; then
            printf '::error::%s missing .nodes.devenv.locked.rev\n' 'devenv.lock'
            exit 1
          fi
          echo "DEVENV_REV=$DEVENV_REV" >> "$GITHUB_ENV"
          echo "Pinned devenv rev: $DEVENV_REV"
        shell: bash
      - name: Resolve devenv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'resolve devenv (devenv.lock)' 'cd "${GITHUB_WORKSPACE:-$PWD}" && '"'"'${{ runner.temp }}/composition-state/ci-runtime/resolve-devenv.sh'"'"' '"'"'devenv.lock'"'"''
        shell: bash
        timeout-minutes: ${{ runner.os == 'macOS' && 3 || 6 }}
      - name: Prepare source generator dependency views
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run buck2:editor:bootstrap' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run buck2:editor:bootstrap'
        timeout-minutes: ${{ runner.os == 'macOS' && 25 || 26 }}
      - name: Force diagnostics failure (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.debug_force_nix_diagnostics_failure == true || inputs.debug_force_nix_diagnostics_failure == 'true') }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-${RUNNER_TEMP:-/tmp}/composition-state/nix-store-diagnostics-missing}"
          mkdir -p "$diag_dir"
          cat > "$diag_dir/synthetic-signature.log" <<'EOF'
          Failed to convert config.cachix to JSON
          ... while evaluating the option `cachix.package`
          error: path '/nix/store/synthetic-invalid-path' is not valid
          EOF
          echo "::warning::Intentional failure for diagnostics validation (#272)"
          exit 1
      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUCK2_PUBLIC_CACHE_WRITE_AUTH: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && secrets.BUCK2_PUBLIC_CACHE_WRITE_AUTH || '' }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          if [ -n "${BUCK2_PUBLIC_CACHE_WRITE_AUTH:-}" ]; then
            BUCK2_CACHE_WRITE_BASIC_AUTH="$(printf '%s' "$BUCK2_PUBLIC_CACHE_WRITE_AUTH" | base64 | tr -d '\n')"
            echo "::add-mask::$BUCK2_CACHE_WRITE_BASIC_AUTH"
            export BUCK2_CACHE_WRITE_BASIC_AUTH
          fi
          unset BUCK2_PUBLIC_CACHE_WRITE_AUTH
          set -m
          bash genie/ci-scripts/test-resource-sampler.sh tmp/ci-resources/test-resources.json &
          resource_sampler=$!
          set +m
          trap 'status=$?; trap - EXIT; kill -TERM -- "-$resource_sampler" 2>/dev/null || :; kill -KILL -- "-$resource_sampler" 2>/dev/null || :; exit "$status"' EXIT
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run test:run' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run test:run'
      - name: Nix diagnostics summary
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-}"
          if [ -z "$diag_dir" ] || [ ! -d "$diag_dir" ]; then
            echo "## Nix Store Diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No diagnostics directory found (validation may have failed before capture)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Nix Store Diagnostics"
            echo ""
            echo "Temporary instrumentation for #272; remove after root cause is confirmed and CI is stable."
            echo ""
            echo "- Diagnostics directory: \`$diag_dir\`"
            echo "- Tracking issue: https://github.com/overengineeringstudio/effect-utils/issues/272"
          } >> "$GITHUB_STEP_SUMMARY"

          markers_file="${RUNNER_TEMP:-/tmp}/nix-store-signature-markers.txt"
          grep -R -n -E "config\\.cachix|cachix\\.package|error: path '/nix/store/.+ is not valid" --exclude="$(basename "$markers_file")" "$diag_dir" > "$markers_file" || true

          if [ -s "$markers_file" ]; then
            {
              echo ""
              echo "### Signature markers"
              echo '```text'
              head -n 120 "$markers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- No signature markers found in captured diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi
      - # v4.6.2
        name: Upload Nix diagnostics artifact
        if: failure() && env.NIX_STORE_DIAGNOSTICS_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'nix-store-diagnostics-${{ github.job }}-${{ runner.os }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.NIX_STORE_DIAGNOSTICS_DIR }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Failure note
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          echo "If this looks like Namespace runner Nix store corruption (e.g. \"... is not valid\", \"config.cachix\", \"cachix.package\"), add the run link + full nix-store output to:"
          echo "  https://github.com/overengineeringstudio/effect-utils/issues/201"
      - # v4.6.2
        name: Upload retained Vitest collection reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'vitest-collection-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: tmp/otel-scrape/summaries/*.vitest.json
          if-no-files-found: ignore
          retention-days: 14
      - # v4.6.2
        name: Upload test resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'test-resources-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: tmp/ci-resources/test-resources.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize CI OpenTelemetry spans
        if: ${{ (always() && env.OTEL_SPAN_SPOOL_DIR != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          span_files=("$OTEL_SPAN_SPOOL_DIR"/*.jsonl)
          if [ "${#span_files[@]}" -eq 0 ]; then
            echo "::notice::No CI OpenTelemetry task spans were emitted"
            exit 0
          fi
          {
            echo "## Slowest devenv tasks"
            echo ""
            echo "| Task | Duration | Status |"
            echo "| --- | ---: | --- |"
            while IFS=$'\t' read -r duration task status; do
              printf '| `%s` | %.2fs | %s |\n' "$task" "$duration" "$status"
            done < <(
              jq -s -r '
                [.[].resourceSpans[].scopeSpans[].spans[]
                  | select(.name == "devenv.task.exec")
                  | (.attributes | map({ key, value: (.value.stringValue // .value.intValue // .value.boolValue) }) | from_entries) as $attrs
                  | [
                      (((.endTimeUnixNano | tonumber) - (.startTimeUnixNano | tonumber)) / 1000000000),
                      ($attrs["task.name"] // $attrs["span.label"] // .name),
                      (if (.status.code // 0) == 2 then "error" else "ok" end)
                    ]
                  | @tsv
                ] | .[]
              ' "${span_files[@]}" | sort -nr | sed -n '1,20p'
            )
          } >> "$GITHUB_STEP_SUMMARY"
      - # v4.6.2
        name: Upload CI OpenTelemetry spans
        if: always() && env.OTEL_SPAN_SPOOL_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'ci-otel-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.OTEL_SPAN_SPOOL_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Collect Buck2 cache evidence
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}"
          nix shell .#bun .#buck2 --command bash genie/ci-scripts/collect-buck2-cache-evidence.sh
      - # v4.6.2
        name: Upload Buck2 cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'buck2-cache-evidence-test-${{ github.run_attempt }}'
          path: |
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}
            ${{ env.CI_BUCK2_CACHE_ACTIONS_PATH }}
            ${{ env.CI_BUCK2_CACHE_WARM99_PATH }}
            ${{ env.CI_BUCK2_CACHE_PROOF_MANIFEST_PATH }}
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shard-index.json
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shards/*.json
          if-no-files-found: warn
          retention-days: 90
      - # v4.4.0
        if: ${{ (always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-test"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  test-macos:
    name: test (namespace-profile-macos-arm64)
    if: ${{ !cancelled() && (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tested-tree.outputs.tested != 'true')) }}
    needs: [tested-tree]
    runs-on: ['namespace-profile-macos-arm64;github.run-id=${{ github.run_id }};job.priority=1']
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && '0' || '1' }}
      EFFECT_UTILS_CI_TEST: '1'
      EFFECT_UTILS_TEST_PLATFORM: darwin
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: test-macos
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: test (namespace-profile-macos-arm64)
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
      BUCK2_CACHE_WRITE_OPTIONAL: '1'
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Prepare CI OpenTelemetry capture
        shell: bash
        run: |
          set -euo pipefail
          spool_dir="${{ runner.temp }}/composition-state/otel-spans"
          mkdir -p "$spool_dir"
          printf 'OTEL_SPAN_SPOOL_DIR=%s\n' "$spool_dir" >> "$GITHUB_ENV"
          printf 'OTEL_SPOOL_MULTI_WRITER=1\n' >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v1.7.0
        name: Mount local Nix substituter cache volume
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        continue-on-error: true
        with:
          path: /Users/runner/.cache/nix-substituter
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - id: linux-sandbox-admission
        name: Log Linux sandbox prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          BUCK2_TS_PRIVILEGE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$BUCK2_TS_PRIVILEGE_ALLOWED" != true ]; then
            echo "::error::Buck TypeScript lane refused: untrusted pull_request runs on an unprivileged Namespace runner; privileged Nix/Bubblewrap execution is not admitted (fork policy Q49 pending)." >&2
            exit 1
          fi
          nix config show | grep -E '^sandbox'
          for key in kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            if sysctl "$key"; then :; else printf "Unavailable sysctl: %s\n" "$key"; fi
          done
          unshare -Ur true
          echo "unshare -Ur true: passed"
      - # v6.1.0
        name: Checkout CI measurement baseline ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.measurement_baseline_ref }}
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: test
          MATRIX_VALUE: namespace-profile-macos-arm64
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - name: Start Buck2 cache evidence window
        shell: bash
        run: |
          set -euo pipefail
          marker="${CI_BUCK2_CACHE_EVIDENCE_START:?cache evidence start not declared}"
          mkdir -p "${marker%/*}"
          started_at=$(( $(date +%s) * 1000 ))
          source_root=""
          fresh_root=0
          if source_root=$(cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}" && pwd -P); then
            if tracked_root=$(git -C "$source_root" rev-parse --show-toplevel 2>/dev/null) &&
               tracked_root=$(cd "$tracked_root" && pwd -P) &&
               [ "$tracked_root" = "$source_root" ] &&
               [ ! -e "$source_root/buck-out" ] && [ ! -L "$source_root/buck-out" ]; then
              fresh_root=1
            fi
          fi
          printf "%s\n%s\n%s\n" "$started_at" "$source_root" "$fresh_root" > "$marker"
          printf "CI_BUCK2_CACHE_EVIDENCE_STARTED_AT=%s\n" "$started_at" >> "$GITHUB_ENV"
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths nixpkgs#cachix)
          echo "$out/bin" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - # v17
        name: Enable Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          skipPush: true
      - name: Enable local Nix substituter
        continue-on-error: true
        run: |
          set -euo pipefail
          conf="${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
          mkdir -p "$(dirname "$conf")"
          printf '\nextra-substituters = %s\n' 'file:///Users/runner/.cache/nix-substituter?priority=10' >> "$conf"
          nix config show substituters
      - name: Prepare CI helper scripts
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          scripts_src='genie/ci-scripts'
          scripts_dst='${{ runner.temp }}/composition-state/ci-runtime'
          if [ ! -d "$scripts_src" ]; then
            echo "::error::CI helper script directory is missing: $scripts_src"
            exit 1
          fi
          rm -rf "$scripts_dst"
          mkdir -p "$scripts_dst"
          cp -R "$scripts_src/." "$scripts_dst/"
          rm -f "$scripts_dst"/*.genie.ts
          chmod +x "$scripts_dst"/*.sh
      - name: Use pinned devenv from lock
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && DEVENV_REV=$(jq -r .nodes.devenv.locked.rev 'devenv.lock')
          if [ -z "$DEVENV_REV" ] || [ "$DEVENV_REV" = "null" ]; then
            printf '::error::%s missing .nodes.devenv.locked.rev\n' 'devenv.lock'
            exit 1
          fi
          echo "DEVENV_REV=$DEVENV_REV" >> "$GITHUB_ENV"
          echo "Pinned devenv rev: $DEVENV_REV"
        shell: bash
      - name: Resolve devenv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'resolve devenv (devenv.lock)' 'cd "${GITHUB_WORKSPACE:-$PWD}" && '"'"'${{ runner.temp }}/composition-state/ci-runtime/resolve-devenv.sh'"'"' '"'"'devenv.lock'"'"''
        shell: bash
        timeout-minutes: ${{ runner.os == 'macOS' && 3 || 6 }}
      - name: Prepare source generator dependency views
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run buck2:editor:bootstrap' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run buck2:editor:bootstrap'
        timeout-minutes: ${{ runner.os == 'macOS' && 25 || 26 }}
      - name: Warm local Nix substituter after bootstrap
        if: ${{ (success()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          started=$SECONDS
          paths="$RUNNER_TEMP/substitutable-store-paths"
          nix path-info --all --json | jq -r 'to_entries[] | select(((.value.signatures // []) | length > 0) or ((.value.ca // "") | length > 0)) | .key' > "$paths"
          sudo env "PATH=$PATH" nix copy --stdin --to 'file:///Users/runner/.cache/nix-substituter?compression=zstd&parallel-compression=true' < "$paths"
          echo "saved $(wc -l < "$paths") signed or content-addressed paths in $((SECONDS - started))s; cache size $(du -sh '/Users/runner/.cache/nix-substituter/' | cut -f1)"
      - name: Force diagnostics failure (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.debug_force_nix_diagnostics_failure == true || inputs.debug_force_nix_diagnostics_failure == 'true') }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-${RUNNER_TEMP:-/tmp}/composition-state/nix-store-diagnostics-missing}"
          mkdir -p "$diag_dir"
          cat > "$diag_dir/synthetic-signature.log" <<'EOF'
          Failed to convert config.cachix to JSON
          ... while evaluating the option `cachix.package`
          error: path '/nix/store/synthetic-invalid-path' is not valid
          EOF
          echo "::warning::Intentional failure for diagnostics validation (#272)"
          exit 1
      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUCK2_PUBLIC_CACHE_WRITE_AUTH: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && secrets.BUCK2_PUBLIC_CACHE_WRITE_AUTH || '' }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          if [ -n "${BUCK2_PUBLIC_CACHE_WRITE_AUTH:-}" ]; then
            BUCK2_CACHE_WRITE_BASIC_AUTH="$(printf '%s' "$BUCK2_PUBLIC_CACHE_WRITE_AUTH" | base64 | tr -d '\n')"
            echo "::add-mask::$BUCK2_CACHE_WRITE_BASIC_AUTH"
            export BUCK2_CACHE_WRITE_BASIC_AUTH
          fi
          unset BUCK2_PUBLIC_CACHE_WRITE_AUTH
          set -m
          bash genie/ci-scripts/test-resource-sampler.sh tmp/ci-resources/test-resources.json &
          resource_sampler=$!
          set +m
          trap 'status=$?; trap - EXIT; kill -TERM -- "-$resource_sampler" 2>/dev/null || :; kill -KILL -- "-$resource_sampler" 2>/dev/null || :; exit "$status"' EXIT
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run test:run' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run test:run'
      - name: Buck daemon cache posture regressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUCK2_PUBLIC_CACHE_WRITE_AUTH: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && secrets.BUCK2_PUBLIC_CACHE_WRITE_AUTH || '' }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          if [ -n "${BUCK2_PUBLIC_CACHE_WRITE_AUTH:-}" ]; then
            BUCK2_CACHE_WRITE_BASIC_AUTH="$(printf '%s' "$BUCK2_PUBLIC_CACHE_WRITE_AUTH" | base64 | tr -d '\n')"
            echo "::add-mask::$BUCK2_CACHE_WRITE_BASIC_AUTH"
            export BUCK2_CACHE_WRITE_BASIC_AUTH
          fi
          unset BUCK2_PUBLIC_CACHE_WRITE_AUTH
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run buck2:cache-posture:ci-test' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run buck2:cache-posture:ci-test'
      - name: Build and smoke native and compiled products
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUCK2_PUBLIC_CACHE_WRITE_AUTH: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && secrets.BUCK2_PUBLIC_CACHE_WRITE_AUTH || '' }}
        run: |
          if [ -n "${BUCK2_PUBLIC_CACHE_WRITE_AUTH:-}" ]; then
            BUCK2_CACHE_WRITE_BASIC_AUTH="$(printf '%s' "$BUCK2_PUBLIC_CACHE_WRITE_AUTH" | base64 | tr -d '\n')"
            echo "::add-mask::$BUCK2_CACHE_WRITE_BASIC_AUTH"
            export BUCK2_CACHE_WRITE_BASIC_AUTH
          fi
          unset BUCK2_PUBLIC_CACHE_WRITE_AUTH
          cd "${GITHUB_WORKSPACE:-$PWD}" && bash genie/ci-scripts/compiled-products.sh
        timeout-minutes: ${{ runner.os == 'macOS' && 4 || 10 }}
      - name: Build Darwin Nix TypeScript product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          echo "Runner default Nix sandbox setting:"
          nix config show sandbox
          nix build .#buck-product-overeng-content-address-from-source --no-link --print-build-logs --option sandbox false
      - name: Save signed and content-addressed store paths to local Nix substituter
        if: ${{ (!cancelled()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          started=$SECONDS
          paths="$RUNNER_TEMP/substitutable-store-paths"
          nix path-info --all --json | jq -r 'to_entries[] | select(((.value.signatures // []) | length > 0) or ((.value.ca // "") | length > 0)) | .key' > "$paths"
          sudo env "PATH=$PATH" nix copy --stdin --to 'file:///Users/runner/.cache/nix-substituter?compression=zstd&parallel-compression=true' < "$paths"
          echo "saved $(wc -l < "$paths") signed or content-addressed paths in $((SECONDS - started))s; cache size $(du -sh '/Users/runner/.cache/nix-substituter/' | cut -f1)"
      - name: Nix diagnostics summary
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-}"
          if [ -z "$diag_dir" ] || [ ! -d "$diag_dir" ]; then
            echo "## Nix Store Diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No diagnostics directory found (validation may have failed before capture)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Nix Store Diagnostics"
            echo ""
            echo "Temporary instrumentation for #272; remove after root cause is confirmed and CI is stable."
            echo ""
            echo "- Diagnostics directory: \`$diag_dir\`"
            echo "- Tracking issue: https://github.com/overengineeringstudio/effect-utils/issues/272"
          } >> "$GITHUB_STEP_SUMMARY"

          markers_file="${RUNNER_TEMP:-/tmp}/nix-store-signature-markers.txt"
          grep -R -n -E "config\\.cachix|cachix\\.package|error: path '/nix/store/.+ is not valid" --exclude="$(basename "$markers_file")" "$diag_dir" > "$markers_file" || true

          if [ -s "$markers_file" ]; then
            {
              echo ""
              echo "### Signature markers"
              echo '```text'
              head -n 120 "$markers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- No signature markers found in captured diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi
      - # v4.6.2
        name: Upload Nix diagnostics artifact
        if: failure() && env.NIX_STORE_DIAGNOSTICS_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'nix-store-diagnostics-${{ github.job }}-${{ runner.os }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.NIX_STORE_DIAGNOSTICS_DIR }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Failure note
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          echo "If this looks like Namespace runner Nix store corruption (e.g. \"... is not valid\", \"config.cachix\", \"cachix.package\"), add the run link + full nix-store output to:"
          echo "  https://github.com/overengineeringstudio/effect-utils/issues/201"
      - # v4.6.2
        name: Upload retained Vitest collection reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'vitest-collection-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: tmp/otel-scrape/summaries/*.vitest.json
          if-no-files-found: ignore
          retention-days: 14
      - # v4.6.2
        name: Upload test resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'test-resources-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: tmp/ci-resources/test-resources.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize CI OpenTelemetry spans
        if: ${{ (always() && env.OTEL_SPAN_SPOOL_DIR != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          span_files=("$OTEL_SPAN_SPOOL_DIR"/*.jsonl)
          if [ "${#span_files[@]}" -eq 0 ]; then
            echo "::notice::No CI OpenTelemetry task spans were emitted"
            exit 0
          fi
          {
            echo "## Slowest devenv tasks"
            echo ""
            echo "| Task | Duration | Status |"
            echo "| --- | ---: | --- |"
            while IFS=$'\t' read -r duration task status; do
              printf '| `%s` | %.2fs | %s |\n' "$task" "$duration" "$status"
            done < <(
              jq -s -r '
                [.[].resourceSpans[].scopeSpans[].spans[]
                  | select(.name == "devenv.task.exec")
                  | (.attributes | map({ key, value: (.value.stringValue // .value.intValue // .value.boolValue) }) | from_entries) as $attrs
                  | [
                      (((.endTimeUnixNano | tonumber) - (.startTimeUnixNano | tonumber)) / 1000000000),
                      ($attrs["task.name"] // $attrs["span.label"] // .name),
                      (if (.status.code // 0) == 2 then "error" else "ok" end)
                    ]
                  | @tsv
                ] | .[]
              ' "${span_files[@]}" | sort -nr | sed -n '1,20p'
            )
          } >> "$GITHUB_STEP_SUMMARY"
      - # v4.6.2
        name: Upload CI OpenTelemetry spans
        if: always() && env.OTEL_SPAN_SPOOL_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'ci-otel-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.OTEL_SPAN_SPOOL_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Collect Buck2 cache evidence
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}"
          nix shell .#bun .#buck2 --command bash genie/ci-scripts/collect-buck2-cache-evidence.sh
      - # v4.6.2
        name: Upload Buck2 cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'buck2-cache-evidence-test-macos-${{ github.run_attempt }}'
          path: |
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}
            ${{ env.CI_BUCK2_CACHE_ACTIONS_PATH }}
            ${{ env.CI_BUCK2_CACHE_WARM99_PATH }}
            ${{ env.CI_BUCK2_CACHE_PROOF_MANIFEST_PATH }}
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shard-index.json
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shards/*.json
          if-no-files-found: warn
          retention-days: 90
      - # v4.4.0
        if: ${{ (always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-test-macos"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  test-playwright-utils:
    if: ${{ !cancelled() && (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tested-tree.outputs.tested != 'true')) }}
    needs: [tested-tree]
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
