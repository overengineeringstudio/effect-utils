    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && '0' || '1' }}
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: test-playwright-utils
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: test-playwright-utils
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
      BUCK2_CACHE_WRITE_OPTIONAL: '1'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-test-playwright-utils"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  test-playwright-tui-react:
    if: ${{ !cancelled() && (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tested-tree.outputs.tested != 'true')) }}
    needs: [tested-tree]
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Prepare CI OpenTelemetry capture
        shell: bash
        run: |
          set -euo pipefail
          spool_dir="${{ runner.temp }}/composition-state/otel-spans"
          mkdir -p "$spool_dir"
          printf 'OTEL_SPAN_SPOOL_DIR=%s\n' "$spool_dir" >> "$GITHUB_ENV"
          printf 'OTEL_SPOOL_MULTI_WRITER=1\n' >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - id: linux-sandbox-admission
        name: Log Linux sandbox prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          BUCK2_TS_PRIVILEGE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$BUCK2_TS_PRIVILEGE_ALLOWED" != true ]; then
            echo "::error::Buck TypeScript lane refused: untrusted pull_request runs on an unprivileged Namespace runner; privileged Nix/Bubblewrap execution is not admitted (fork policy Q49 pending)." >&2
            exit 1
          fi
          nix config show | grep -E '^sandbox'
          for key in kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            if sysctl "$key"; then :; else printf "Unavailable sysctl: %s\n" "$key"; fi
          done
          unshare -Ur true
          echo "unshare -Ur true: passed"
      - # v6.1.0
        name: Checkout CI measurement baseline ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.measurement_baseline_ref }}
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: test-playwright-tui-react
          MATRIX_VALUE: ''
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - name: Start Buck2 cache evidence window
        shell: bash
        run: |
          set -euo pipefail
          marker="${CI_BUCK2_CACHE_EVIDENCE_START:?cache evidence start not declared}"
          mkdir -p "${marker%/*}"
          started_at=$(( $(date +%s) * 1000 ))
          source_root=""
          fresh_root=0
          if source_root=$(cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}" && pwd -P); then
            if tracked_root=$(git -C "$source_root" rev-parse --show-toplevel 2>/dev/null) &&
               tracked_root=$(cd "$tracked_root" && pwd -P) &&
               [ "$tracked_root" = "$source_root" ] &&
               [ ! -e "$source_root/buck-out" ] && [ ! -L "$source_root/buck-out" ]; then
              fresh_root=1
            fi
          fi
          printf "%s\n%s\n%s\n" "$started_at" "$source_root" "$fresh_root" > "$marker"
          printf "CI_BUCK2_CACHE_EVIDENCE_STARTED_AT=%s\n" "$started_at" >> "$GITHUB_ENV"
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
