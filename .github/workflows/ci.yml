          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - id: linux-sandbox-admission
        name: Log Linux sandbox prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          BUCK2_TS_PRIVILEGE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$BUCK2_TS_PRIVILEGE_ALLOWED" != true ]; then
            echo "::error::Buck TypeScript lane refused: untrusted pull_request runs on an unprivileged Namespace runner; privileged Nix/Bubblewrap execution is not admitted (fork policy Q49 pending)." >&2
            exit 1
          fi
          nix config show | grep -E '^sandbox'
          for key in kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            if sysctl "$key"; then :; else printf "Unavailable sysctl: %s\n" "$key"; fi
          done
          unshare -Ur true
          echo "unshare -Ur true: passed"
      - # v6.1.0
        name: Checkout CI measurement baseline ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.measurement_baseline_ref }}
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: deploy-storybooks
          MATRIX_VALUE: ''
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - name: Start Buck2 cache evidence window
        shell: bash
        run: |
          set -euo pipefail
          marker="${CI_BUCK2_CACHE_EVIDENCE_START:?cache evidence start not declared}"
          mkdir -p "${marker%/*}"
          started_at=$(( $(date +%s) * 1000 ))
          source_root=""
          fresh_root=0
          if source_root=$(cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}" && pwd -P); then
            if tracked_root=$(git -C "$source_root" rev-parse --show-toplevel 2>/dev/null) &&
               tracked_root=$(cd "$tracked_root" && pwd -P) &&
               [ "$tracked_root" = "$source_root" ] &&
               [ ! -e "$source_root/buck-out" ] && [ ! -L "$source_root/buck-out" ]; then
              fresh_root=1
            fi
          fi
          printf "%s\n%s\n%s\n" "$started_at" "$source_root" "$fresh_root" > "$marker"
          printf "CI_BUCK2_CACHE_EVIDENCE_STARTED_AT=%s\n" "$started_at" >> "$GITHUB_ENV"
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths nixpkgs#cachix)
          echo "$out/bin" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - # v17
        name: Enable Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          skipPush: true
      - name: Prepare CI helper scripts
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          scripts_src='genie/ci-scripts'
          scripts_dst='${{ runner.temp }}/composition-state/ci-runtime'
          if [ ! -d "$scripts_src" ]; then
            echo "::error::CI helper script directory is missing: $scripts_src"
            exit 1
          fi
          rm -rf "$scripts_dst"
          mkdir -p "$scripts_dst"
          cp -R "$scripts_src/." "$scripts_dst/"
          rm -f "$scripts_dst"/*.genie.ts
          chmod +x "$scripts_dst"/*.sh
      - name: Use pinned devenv from lock
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && DEVENV_REV=$(jq -r .nodes.devenv.locked.rev 'devenv.lock')
          if [ -z "$DEVENV_REV" ] || [ "$DEVENV_REV" = "null" ]; then
            printf '::error::%s missing .nodes.devenv.locked.rev\n' 'devenv.lock'
            exit 1
          fi
          echo "DEVENV_REV=$DEVENV_REV" >> "$GITHUB_ENV"
          echo "Pinned devenv rev: $DEVENV_REV"
        shell: bash
      - name: Resolve devenv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'resolve devenv (devenv.lock)' 'cd "${GITHUB_WORKSPACE:-$PWD}" && '"'"'${{ runner.temp }}/composition-state/ci-runtime/resolve-devenv.sh'"'"' '"'"'devenv.lock'"'"''
        shell: bash
        timeout-minutes: ${{ runner.os == 'macOS' && 3 || 6 }}
      - name: Prepare source generator dependency views
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run buck2:editor:bootstrap' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run buck2:editor:bootstrap'
        timeout-minutes: ${{ runner.os == 'macOS' && 25 || 26 }}
      - name: Force diagnostics failure (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.debug_force_nix_diagnostics_failure == true || inputs.debug_force_nix_diagnostics_failure == 'true') }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-${RUNNER_TEMP:-/tmp}/composition-state/nix-store-diagnostics-missing}"
          mkdir -p "$diag_dir"
          cat > "$diag_dir/synthetic-signature.log" <<'EOF'
          Failed to convert config.cachix to JSON
          ... while evaluating the option `cachix.package`
          error: path '/nix/store/synthetic-invalid-path' is not valid
          EOF
          echo "::warning::Intentional failure for diagnostics validation (#272)"
          exit 1
      - id: deploy
        name: Deploy storybooks to Netlify
        shell: bash
        run: |
          workflow_report_dir="${RUNNER_TEMP:-/tmp}/workflow-reports"
          mkdir -p "$workflow_report_dir"
          workflow_report_path="$(mktemp "$workflow_report_dir/netlify-storybooks.XXXXXX.jsonl")"
          export WORKFLOW_REPORT_OUTPUT_FILE="$workflow_report_path"
          deploy_ran=0
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            deploy_ran=1
            __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run netlify:deploy --show-output --input type=prod --input missingAuthPolicy=skip --input urlEnvKey=NETLIFY_DEPLOY_URL_STORYBOOK' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run netlify:deploy --show-output --input type=prod --input missingAuthPolicy=skip --input urlEnvKey=NETLIFY_DEPLOY_URL_STORYBOOK'
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            deploy_ran=1
            __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run netlify:deploy --show-output --input type=pr --input pr=${{ github.event.pull_request.number }} --input missingAuthPolicy=skip --input urlEnvKey=NETLIFY_DEPLOY_URL_STORYBOOK' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run netlify:deploy --show-output --input type=pr --input pr=${{ github.event.pull_request.number }} --input missingAuthPolicy=skip --input urlEnvKey=NETLIFY_DEPLOY_URL_STORYBOOK'
          fi
          if [ "$deploy_ran" = "1" ] && [ ! -s "$workflow_report_path" ]; then
            echo "Error: ci-tools did not emit a Netlify workflow report record." >&2
            exit 1
          fi
          if [ "$deploy_ran" = "1" ]; then
            echo "workflow_report_path=$workflow_report_path" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
      - name: Collect workflow report bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPORT_BUNDLE_ID: storybook-preview
          WORKFLOW_REPORT_INPUT_PATHS_JSON: '["${{ steps.deploy.outputs.workflow_report_path }}"]'
          WORKFLOW_REPORT_OUTPUT_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-bundle.json'
          WORKFLOW_REPORT_RECORD_MARKER: 'WORKFLOW_REPORT_V1: '
          WORKFLOW_REPORT_ALLOW_MISSING_INPUT: '1'
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run workflow-report:collect-bundle --show-output' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run workflow-report:collect-bundle --show-output'
      - name: Render workflow report comment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REPORT_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REPORT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_REPORT_BUNDLE_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-bundle.json'
          WORKFLOW_REPORT_COMMENT_BODY_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-comment.md'
          WORKFLOW_REPORT_SUMMARY_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-summary.md'
          WORKFLOW_REPORT_TITLE: Storybook Previews
          WORKFLOW_REPORT_NO_RECORDS_MESSAGE: No storybooks were deployed.
          WORKFLOW_REPORT_STATE_ID: storybook-preview
          WORKFLOW_REPORT_ENTRY_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REPORT_ENTRY_LABEL: ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || 'prod' }}
          WORKFLOW_REPORT_CREATED_AT_UTC: ''
          WORKFLOW_REPORT_TIME_ZONE: UTC
          WORKFLOW_REPORT_MANAGED_MARKER: '<!-- workflow-report:managed -->'
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run workflow-report:render-comment-body --show-output' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run workflow-report:render-comment-body --show-output'
      - name: Publish workflow report
        if: ${{ (always() && !cancelled()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REPORT_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REPORT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_REPORT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WORKFLOW_REPORT_STATE_ID: storybook-preview
          WORKFLOW_REPORT_COMMENT_BODY_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-comment.md'
          WORKFLOW_REPORT_SUMMARY_PATH: '${{ runner.temp }}/workflow-reports/storybook-preview-summary.md'
          WORKFLOW_REPORT_MANAGED_MARKER: '<!-- workflow-report:managed -->'
          PIPELINE_RUN_PREFIX: ${{ format('{0} shell -- otel-span pipeline-run --', env.DEVENV_BIN) }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'devenv tasks run workflow-report:publish --show-output' 'cd "${GITHUB_WORKSPACE:-$PWD}" && if [ -n "${NIX_CONFIG:-}" ]; then NIX_CONFIG_WITH_APPEND=$(printf '"'"'%s\n%s'"'"' "$NIX_CONFIG" '"'"'restrict-eval = false'"'"'); else NIX_CONFIG_WITH_APPEND='"'"'restrict-eval = false'"'"'; fi; NIX_CONFIG="$NIX_CONFIG_WITH_APPEND" DEVENV_TASK_PASSTHROUGH=1 DEVENV_TUI=false ${PIPELINE_RUN_PREFIX:+$PIPELINE_RUN_PREFIX }"${DEVENV_BIN:?DEVENV_BIN not set}" tasks run workflow-report:publish --show-output'
      - name: Nix diagnostics summary
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          diag_dir="${NIX_STORE_DIAGNOSTICS_DIR:-}"
          if [ -z "$diag_dir" ] || [ ! -d "$diag_dir" ]; then
            echo "## Nix Store Diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No diagnostics directory found (validation may have failed before capture)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Nix Store Diagnostics"
            echo ""
            echo "Temporary instrumentation for #272; remove after root cause is confirmed and CI is stable."
            echo ""
            echo "- Diagnostics directory: \`$diag_dir\`"
            echo "- Tracking issue: https://github.com/overengineeringstudio/effect-utils/issues/272"
          } >> "$GITHUB_STEP_SUMMARY"

          markers_file="${RUNNER_TEMP:-/tmp}/nix-store-signature-markers.txt"
          grep -R -n -E "config\\.cachix|cachix\\.package|error: path '/nix/store/.+ is not valid" --exclude="$(basename "$markers_file")" "$diag_dir" > "$markers_file" || true

          if [ -s "$markers_file" ]; then
            {
              echo ""
              echo "### Signature markers"
              echo '```text'
              head -n 120 "$markers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- No signature markers found in captured diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi
      - # v4.6.2
        name: Upload Nix diagnostics artifact
        if: failure() && env.NIX_STORE_DIAGNOSTICS_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'nix-store-diagnostics-${{ github.job }}-${{ runner.os }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}'
          path: ${{ env.NIX_STORE_DIAGNOSTICS_DIR }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Failure note
        if: ${{ (failure()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        run: |
          echo "If this looks like Namespace runner Nix store corruption (e.g. \"... is not valid\", \"config.cachix\", \"cachix.package\"), add the run link + full nix-store output to:"
          echo "  https://github.com/overengineeringstudio/effect-utils/issues/201"
      - name: Collect Buck2 cache evidence
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}"
          nix shell .#bun .#buck2 --command bash genie/ci-scripts/collect-buck2-cache-evidence.sh
      - # v4.6.2
        name: Upload Buck2 cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'buck2-cache-evidence-deploy-storybooks-${{ github.run_attempt }}'
          path: |
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}
            ${{ env.CI_BUCK2_CACHE_ACTIONS_PATH }}
            ${{ env.CI_BUCK2_CACHE_WARM99_PATH }}
            ${{ env.CI_BUCK2_CACHE_PROOF_MANIFEST_PATH }}
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shard-index.json
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shards/*.json
          if-no-files-found: warn
          retention-days: 90
      - # v4.4.0
        if: ${{ (always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: deploy-storybooks
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: deploy-storybooks
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-deploy-storybooks"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  notify-alignment:
    runs-on: ['namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};job.priority=4']
    timeout-minutes: 30
    needs: [tested-tree, quality, deploy-storybooks]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (needs.quality.result == 'success' || needs.tested-tree.outputs.tested == 'true') && needs['deploy-storybooks'].result == 'success' }}
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Dispatch alignment to coordinator
        env:
          GH_TOKEN: ${{ secrets.MEGAREPO_ALIGNMENT_TOKEN }}
        run: |
          payload=$(printf '{"event_type":"upstream-changed","client_payload":{"source_repo":"%s","source_sha":"%s"}}' "${{ github.repository }}" "${{ github.sha }}")
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/schickling/megarepo-all/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"
        shell: bash
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '1'
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-notify-alignment"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  promote-published:
    needs: [publish-products, consumer-smoke]
    if: github.repository == 'overengineeringstudio/effect-utils' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['publish-products'].result == 'success' && needs['consumer-smoke'].result == 'success' && needs['publish-products'].outputs.current-sha == github.sha && needs['consumer-smoke'].outputs.current-sha == github.sha
    runs-on: ['namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};job.priority=1']
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v3.3.0
        id: published-ref-token
        name: Mint publisher GitHub App token for published ref
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.NIX_PUBLISHER_GITHUB_APP_ID }}
          private-key: ${{ secrets.NIX_PUBLISHER_GITHUB_APP_PRIVATE_KEY }}
          owner: overengineeringstudio
          repositories: effect-utils
          permission-contents: write
        if: github.repository == 'overengineeringstudio/effect-utils' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['publish-products'].result == 'success' && needs['consumer-smoke'].result == 'success' && needs['publish-products'].outputs.current-sha == github.sha && needs['consumer-smoke'].outputs.current-sha == github.sha
      - id: advance-published-ref
        name: Advance published ref
        if: github.repository == 'overengineeringstudio/effect-utils' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['publish-products'].result == 'success' && needs['consumer-smoke'].result == 'success' && needs['publish-products'].outputs.current-sha == github.sha && needs['consumer-smoke'].outputs.current-sha == github.sha
        env:
          GITHUB_TOKEN: ${{ steps.published-ref-token.outputs.token }}
          GH_TOKEN: ${{ steps.published-ref-token.outputs.token }}
        run: |
          set -euo pipefail
          source genie/ci-workflow/published-ref-decide.sh
          gh auth setup-git
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" = 5
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin main
          fi
          fetch_published() {
            local result
            if git ls-remote --exit-code origin refs/heads/published > /dev/null; then
              git fetch --no-tags origin +refs/heads/published:refs/remotes/origin/published
              git rev-parse refs/remotes/origin/published
            else
              result=$?
              if [ "$result" -ne 2 ]; then return "$result"; fi
            fi
          }
          for attempt in 1 2 3; do
            tip="$(fetch_published)"
            case "$(decide "$tip" "$GITHUB_SHA")" in
              noop)
                echo "published $tip -> $tip (already at or ahead of $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              create|push)
                if git push origin "$GITHUB_SHA:refs/heads/published"; then
                  echo "published ${tip:-<absent>} -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "::notice::published push attempt $attempt rejected; refetching before retry"
                ;;
              diverged)
                echo "::error::published $tip is not an ancestor of $GITHUB_SHA; refusing non-fast-forward update"
                exit 1
                ;;
              *)
                echo "::error::Unable to classify published ancestry"
                exit 1
                ;;
            esac
          done
          tip="$(fetch_published)"
          if [ "$(decide "$tip" "$GITHUB_SHA")" = noop ]; then
            echo "published $tip -> $tip (concurrent run already advanced past $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Failed to advance published to $GITHUB_SHA after 3 push attempts"
          exit 1
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-promote-published"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  pipeline-attempt-close:
    runs-on: ubuntu-latest
    needs:
      - default-ref-policy
      - pr-buck2-tools
      - quality
      - test
      - test-macos
      - test-playwright-utils
      - test-playwright-tui-react
      - test-megarepo-store-gc
      - cargo
      - weaver
      - pr-a-inert-buck
      - build-products
      - consumer-smoke
      - promote-published
      - publish-products
      - trusted-buck2-remote-cache-proof
      - pr-reviews-resolved
      - source-shape
      - test-integration-notion
      - test-integration-restate
      - test-live-deploy-ci-tools
      - deploy-storybooks
      - notify-alignment
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
      PIPELINE_TRUSTED: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v31.11.3
        name: Prepare Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
        timeout-minutes: 2
      - # v4.4.0
        if: ${{ always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Link started job roots
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.default-ref-policy.result == 'success' }}
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: 'nix shell .#bun .#otel-span .#buck2-events --command bash genie/ci-scripts/evidence-job.sh close || true'
        timeout-minutes: 6
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-pipeline-attempt-close"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  pipeline-traces:
    needs: [pipeline-attempt-close]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_EVIDENCE_MODE == 'upload' }}
    runs-on:
      [
        "namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }}${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ';container.privileged=true' || '' }};job.priority=4",
      ]
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    continue-on-error: true
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - name: Publish Pipeline traces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GRAFANA_BASE_URL: ${{ vars.GRAFANA_BASE_URL }}
          PIPELINE_TRACES_PUBLIC_ASSET_COMMAND: ${{ vars.PIPELINE_TRACES_PUBLIC_ASSET_COMMAND }}
        run: bash genie/ci-scripts/pipeline-traces-report.sh
        timeout-minutes: 7
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-pipeline-traces"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  consumer-smoke:
    if: ${{ (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      [
        "namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }}${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ';container.privileged=true' || '' }};job.priority=1",
      ]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      current-sha: ${{ steps.consumer-smoke.outputs.current-sha }}
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
      - id: linux-sandbox-admission
        name: Log Linux sandbox prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          BUCK2_TS_PRIVILEGE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$BUCK2_TS_PRIVILEGE_ALLOWED" != true ]; then
            echo "::error::Buck TypeScript lane refused: untrusted pull_request runs on an unprivileged Namespace runner; privileged Nix/Bubblewrap execution is not admitted (fork policy Q49 pending)." >&2
            exit 1
          fi
          nix config show | grep -E '^sandbox'
          for key in kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            if sysctl "$key"; then :; else printf "Unavailable sysctl: %s\n" "$key"; fi
          done
          unshare -Ur true
          echo "unshare -Ur true: passed"
      - name: Prepare CI helper scripts
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          scripts_src='genie/ci-scripts'
          scripts_dst='${{ runner.temp }}/composition-state/ci-runtime'
          if [ ! -d "$scripts_src" ]; then
            echo "::error::CI helper script directory is missing: $scripts_src"
            exit 1
          fi
          rm -rf "$scripts_dst"
          mkdir -p "$scripts_dst"
          cp -R "$scripts_src/." "$scripts_dst/"
          rm -f "$scripts_dst"/*.genie.ts
          chmod +x "$scripts_dst"/*.sh
      - name: Use pinned devenv from lock
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && DEVENV_REV=$(jq -r .nodes.devenv.locked.rev 'devenv.lock')
          if [ -z "$DEVENV_REV" ] || [ "$DEVENV_REV" = "null" ]; then
            printf '::error::%s missing .nodes.devenv.locked.rev\n' 'devenv.lock'
            exit 1
          fi
          echo "DEVENV_REV=$DEVENV_REV" >> "$GITHUB_ENV"
          echo "Pinned devenv rev: $DEVENV_REV"
        shell: bash
      - name: Resolve devenv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'resolve devenv (devenv.lock)' 'cd "${GITHUB_WORKSPACE:-$PWD}" && '"'"'${{ runner.temp }}/composition-state/ci-runtime/resolve-devenv.sh'"'"' '"'"'devenv.lock'"'"''
        shell: bash
      - id: consumer-smoke
        name: Install an isolated consumer from the candidate checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash nix/fixtures/consumer-smoke/run.sh "$PWD" "${DEVENV_BIN:?DEVENV_BIN not set}"
          echo "current-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-consumer-smoke"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
