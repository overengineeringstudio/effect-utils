                fi
                ;;
            esac
            invalid_sources+=("$path")
          done < <(git ls-files -z -- ':(glob)nix/buck2-products/**/*.nix')
          tracked_source=$(printf '%s\n' "${invalid_sources[@]}")
          if [ -n "$tracked_editor$tracked_product$tracked_source" ]; then
