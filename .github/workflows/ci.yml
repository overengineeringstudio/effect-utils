      CI_MEASUREMENT_ALLOW_PROBE_FAILURES: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && '1' || '' }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '1'
