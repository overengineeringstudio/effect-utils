        run: |
          set -euo pipefail

          ensure_ci_measurement_tool() {
            tool_name="$1"
            nix_attr="$2"
            if command -v "$tool_name" >/dev/null 2>&1; then
              return 0
            fi
            if ! command -v nix >/dev/null 2>&1; then
              return 1
            fi
