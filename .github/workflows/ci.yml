      - # v4.6.2
        name: Upload CI OpenTelemetry spans
        if: always() && env.OTEL_SPAN_SPOOL_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
