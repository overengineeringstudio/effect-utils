      - name: Realise source-shape tool closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'nix build --no-update-lock-file --no-link .#buck2-node'
      - name: 'Measure source shape: effect-utils'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: tmp/source-shape-ci/current/effect-utils
          RUNNER_CLASS: '${{ runner.os }}-${{ runner.arch }}'
        run: |
          set -euo pipefail

          node_out="$(nix build --no-update-lock-file --no-link --print-out-paths .#buck2-node)"

          mkdir -p "$ARTIFACT_DIR"
          target_id='effect_utils'
          target_name='effect-utils'
          target_label='effect-utils repository'
          target_group='source'
          artifact_file="$ARTIFACT_DIR/measurements.json"
          target_system="${DEVENV_SYSTEM:-${RUNNER_OS:-unknown}}"

          SCOPES_JSON='[{"id":"genie_ci_workflow","label":"Genie CI workflow helpers","group":"source / ci","path":["source","effect-utils","genie","ci-workflow"],"includePaths":["genie/ci-workflow",".github/workflows/ci.yml.genie.ts",".github/workflows/empirical-proofs.yml.genie.ts"],"includeExtensions":[".ts"]},{"id":"genie_runtime","label":"Genie runtime","group":"source / genie","path":["source","effect-utils","packages","genie"],"includePaths":["packages/@overeng/genie/src"],"includeExtensions":[".ts",".tsx"]},{"id":"nix_workspace_tools","label":"Nix workspace tools","group":"source / nix","path":["source","effect-utils","nix","workspace-tools"],"includePaths":["nix/workspace-tools"],"includeExtensions":[".nix"]}]' \
          TARGET_PATH_JSON='["source","effect-utils"]' \
          TARGET_ID="$target_id" \
          TARGET_NAME="$target_name" \
          TARGET_LABEL="$target_label" \
          TARGET_GROUP="$target_group" \
          TARGET_SYSTEM="$target_system" \
          "$node_out/bin/node" <<'NODE' >"$artifact_file"
          const cp = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')

          const normalize = (value) => {
            const normalized = value.replace(/\\/g, '/').replace(/^\.\//, '').replace(/\/+$/, '')
            return normalized === '.' ? '' : normalized
          }
          const scopes = JSON.parse(process.env.SCOPES_JSON || '[]')
          const targetPath = JSON.parse(process.env.TARGET_PATH_JSON || '["source"]')
          const gitFiles = cp
            .execFileSync('git', ['ls-files', '-z'], { encoding: 'buffer' })
            .toString('utf8')
            .split('\0')
            .filter(Boolean)
            .map(normalize)

          const includesPath = (file, candidates) => {
            if (!Array.isArray(candidates) || candidates.length === 0) return true
            return candidates.map(normalize).some((candidate) => candidate === '' || file === candidate || file.startsWith(candidate + '/'))
          }

          const excludesPath = (file, candidates) =>
            Array.isArray(candidates) &&
            candidates.map(normalize).some((candidate) => candidate !== '' && (file === candidate || file.startsWith(candidate + '/')))

          const matchesExtension = (file, extensions) => {
            if (!Array.isArray(extensions) || extensions.length === 0) return true
            const ext = path.extname(file).toLowerCase()
            return extensions.map((extension) => extension.toLowerCase()).some((extension) => ext === extension)
          }

          const countLines = (file) => {
            const buffer = fs.readFileSync(file)
            if (buffer.includes(0)) return undefined
            if (buffer.length === 0) return 0
            let lines = 0
            for (const byte of buffer) {
              if (byte === 10) lines += 1
            }
            return buffer[buffer.length - 1] === 10 ? lines : lines + 1
          }

          const observations = []
          const scopeSummaries = []

          for (const scope of scopes) {
            const root = normalize(scope.root || '.')
            const includePaths = Array.isArray(scope.includePaths) && scope.includePaths.length > 0 ? scope.includePaths : [root]
            const files = gitFiles
              .filter((file) => includesPath(file, includePaths))
              .filter((file) => !excludesPath(file, scope.excludePaths))
              .filter((file) => matchesExtension(file, scope.includeExtensions))

            let lineCount = 0
            let measuredFileCount = 0
            for (const file of files) {
              const lines = countLines(file)
              if (lines === undefined) continue
              lineCount += lines
              measuredFileCount += 1
            }

            const group = scope.group || 'source shape'
            const scopePath = Array.isArray(scope.path) ? scope.path : ['source', scope.id]
            const policy = scope.gate || { enabled: false, minBaselineSources: 3, minCurrentSamples: 1 }
            observations.push(
              {
                id: 'source.lines',
                label: scope.label + ' lines',
                group,
                path: scopePath,
                description: 'Tracked non-binary source lines in the configured scope.',
                measurementKind: 'deterministic',
                name: 'source.lines',
                unit: 'lines',
                value: lineCount,
                dimensions: { scope: scope.id },
                policy,
                statistics: { sampleCount: 1, measuredSampleCount: measuredFileCount },
              },
              {
                id: 'source.files',
                label: scope.label + ' files',
                group,
                path: scopePath,
                description: 'Tracked non-binary source files in the configured scope.',
                measurementKind: 'deterministic',
                name: 'source.files',
                unit: 'count',
                value: measuredFileCount,
                dimensions: { scope: scope.id },
                policy,
                statistics: { sampleCount: 1, measuredSampleCount: measuredFileCount },
              },
            )
            scopeSummaries.push({
              id: scope.id,
              label: scope.label,
              root,
              includePaths,
              excludePaths: scope.excludePaths || [],
              includeExtensions: scope.includeExtensions || [],
              fileCount: measuredFileCount,
              lineCount,
            })
          }

          const artifact = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            producer: {
              name: 'effect-utils-ci-measurement',
              version: 1,
              measurementProtocol: 'source-shape-v1',
            },
            subject: {
              repo: process.env.GITHUB_REPOSITORY || 'unknown',
              branchKind: process.env.GITHUB_EVENT_NAME || 'unknown',
              ref: process.env.CI_MEASUREMENT_SUBJECT_REF || process.env.GITHUB_REF || 'unknown',
              headSha: process.env.CI_MEASUREMENT_SUBJECT_SHA || process.env.GITHUB_SHA || 'unknown',
              baseSha: process.env.GITHUB_BASE_SHA || '',
            },
            execution: {
              provider: process.env.GITHUB_RUN_ID && process.env.GITHUB_RUN_ID !== 'unknown' ? 'github-actions' : 'local',
              workflow: 'CI',
              job: process.env.GITHUB_JOB || 'unknown',
              runId: process.env.GITHUB_RUN_ID || 'unknown',
              runAttempt: process.env.GITHUB_RUN_ATTEMPT || 'unknown',
              taskId: process.env.CROSSTASK_TASK_ID || '',
              attemptId: process.env.CROSSTASK_ATTEMPT_ID || '',
              traceId: process.env.TRACE_ID || '',
              runner: {
                name: process.env.RUNNER_NAME || 'unknown',
                os: process.env.RUNNER_OS || 'unknown',
                arch: process.env.RUNNER_ARCH || 'unknown',
                class: process.env.RUNNER_CLASS || 'unknown',
              },
            },
            target: {
              kind: 'source-shape',
              id: process.env.TARGET_ID,
              name: process.env.TARGET_NAME,
              label: process.env.TARGET_LABEL,
              group: process.env.TARGET_GROUP,
              path: targetPath,
              system: process.env.TARGET_SYSTEM,
            },
            observations,
            details: { scopes: scopeSummaries },
          }

          process.stdout.write(JSON.stringify(artifact, null, 2) + '\n')
          NODE

          cat "$artifact_file"

        timeout-minutes: 2
      - # v4.6.2
        name: 'Upload CI measurements: source-shape'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-shape
          path: |
            tmp/source-shape-ci
            !tmp/source-shape-ci/baseline/**
          if-no-files-found: error
          retention-days: 14
      - # v4.4.0
        if: ${{ (always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '') && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ (always()) && ((runner.os != 'Linux' || steps.linux-sandbox-admission.outcome == 'success')) }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    needs: [default-ref-policy]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-source-shape"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  test-integration-notion:
    if: ${{ (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.run_notion_integration_on_branch == true)) }}
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
