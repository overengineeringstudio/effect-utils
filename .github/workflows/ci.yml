          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-build-products"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  publish-products:
    if: ${{ (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      GITHUB_TOKEN: ${{ github.token }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '1'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
    outputs:
      current-sha: ${{ steps.publication-scope.outputs.current-sha || steps.product-publication.outputs.current-sha }}
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Mark product manifest publication pending
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=buck2-products/manifest-current -f state=pending \
            -f description="Checking published product manifest" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: publish-products
          MATRIX_VALUE: ''
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - id: publication-scope
        name: Check publication scope
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then
            git fetch --no-tags --deepen=1 origin main
            publish=false
            while IFS= read -r changed; do
              if [ "$changed" != nix/buck2-products/manifest.json ]; then
                publish=true
                break
              fi
            done < <(git diff --name-only HEAD^ HEAD)
            if [ "$publish" = false ]; then
              publish=true
              published_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .head.ref == "automation/buck2-products-manifest" and .user.login == "overeng-nix-publisher[bot]")] | .[0].head.sha // empty')"
              if [ -n "$published_sha" ]; then
                git fetch --no-tags --depth=2 origin "$published_sha"
                if [ "$(git rev-parse "$published_sha^")" = "$(git rev-parse HEAD^)" ] && git diff --quiet "$published_sha" HEAD -- nix/buck2-products/manifest.json; then
                  publish=false
                fi
              fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f context=buck2-products/manifest-current -f state=success \
              -f description="Publisher manifest-only merge is current" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "current-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = 
            extra-trusted-public-keys = 
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        id: product-nix
        if: steps.publication-scope.outputs.publish == 'true'
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths nixpkgs#cachix)
          echo "$out/bin" >> "$GITHUB_PATH"
        id: product-cachix-cli
        if: steps.publication-scope.outputs.publish == 'true'
        timeout-minutes: 3
      - # v17
        name: Enable Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          skipPush: true
        id: product-cachix-read
        if: steps.publication-scope.outputs.publish == 'true'
      - name: Realise publish-products build inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.publication-scope.outputs.publish == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'cd "${GITHUB_WORKSPACE:-$PWD}" && nix/buck2-products/publish.sh --realise-inputs'
      - # v17
        name: Publish to Cachix
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.publication-scope.outputs.publish == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        id: product-cachix-auth
      - id: product-publication
        name: Publish products
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.publication-scope.outputs.publish == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          proposal="${RUNNER_TEMP:?RUNNER_TEMP not set}/buck2-products-manifest.json"
          if nix/buck2-products/publish.sh --proposal "$proposal"; then
            :
          else
            result=$?
            echo "cause=publish.sh failed (exit $result): build, network, or Cachix error; inspect run" >> "$GITHUB_OUTPUT"
            exit "$result"
          fi
          if cmp -s nix/buck2-products/manifest.json "$proposal"; then
            echo "::notice::The v2 product manifest is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f context=buck2-products/manifest-current -f state=success \
              -f description="Published product manifest is current" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "current-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            comparison=$?
            if [ "$comparison" -ne 1 ]; then
              echo "::error::Manifest comparison failed (cmp exit $comparison)"
              echo "cause=Manifest comparison I/O error (cmp exit $comparison)" >> "$GITHUB_OUTPUT"
              exit "$comparison"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            stale=$(jq -nr --slurpfile old nix/buck2-products/manifest.json --slurpfile new "$proposal" '[$old[0].products[], $new[0].products[]] | group_by(.name) | map(select(length != 2 or .[0] != .[1]) | .[0].name) | join(", ")')
            description="Stale products: $stale"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f context=buck2-products/manifest-current -f state=failure \
              -f description="${description:0:140}" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "stale-status=true" >> "$GITHUB_OUTPUT"
          fi
        timeout-minutes: 32
      - id: publisher-app-config
        name: Check publisher GitHub App configuration
        if: steps.product-publication.outputs.changed == 'true'
        env:
          APP_ID: ${{ vars.NIX_PUBLISHER_GITHUB_APP_ID }}
          APP_PRIVATE_KEY_PRESENT: ${{ secrets.NIX_PUBLISHER_GITHUB_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$APP_ID" ] && [ "$APP_PRIVATE_KEY_PRESENT" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Product cache published; manifest PR waits for the publisher GitHub App variable and secret"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - # v3.3.0
        id: publisher-app-token
        name: Mint publisher GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.NIX_PUBLISHER_GITHUB_APP_ID }}
          private-key: ${{ secrets.NIX_PUBLISHER_GITHUB_APP_PRIVATE_KEY }}
          owner: overengineeringstudio
          repositories: effect-utils
        if: steps.publisher-app-config.outputs.enabled == 'true'
      - name: Propose published product manifest
        if: steps.publisher-app-config.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.publisher-app-token.outputs.token }}
          GH_TOKEN: ${{ steps.publisher-app-token.outputs.token }}
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          proposal="${RUNNER_TEMP:?RUNNER_TEMP not set}/buck2-products-manifest.json"
          branch=automation/buck2-products-manifest
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          cp "$proposal" nix/buck2-products/manifest.json
          git add nix/buck2-products/manifest.json
          git config user.name 'overeng-nix-publisher[bot]'
          git config user.email '${{ vars.NIX_PUBLISHER_GITHUB_APP_ID }}+overeng-nix-publisher[bot]@users.noreply.github.com'
          git commit -m 'chore(buck2): update product cache manifest'
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ! gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            gh pr create --base main --head "$branch" \
              --title 'chore(buck2): update product cache manifest' \
              --body 'Updates the generated v2 manifest after the trusted main-branch cache publication job.'
          fi
      - name: Keep interrupted publication pending
        if: failure() && steps.product-publication.outputs.stale-status != 'true' && steps.publication-scope.outputs.current-sha != github.sha && steps.product-publication.outputs.current-sha != github.sha
        env:
          PUBLICATION_CAUSE: ${{ steps.product-publication.outputs.cause || (steps.product-nix.outcome == 'failure' && 'Nix setup failed') || (steps.product-cachix-cli.outcome == 'failure' && 'Cachix CLI setup failed') || (steps.product-cachix-auth.outcome == 'failure' && 'Cachix authentication failed') || 'Publication network/API or scope error; inspect run' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=buck2-products/manifest-current -f state=pending \
            -f description="${PUBLICATION_CAUSE:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - # v4.4.0
        if: ${{ always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ always() }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-publish-products"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  trusted-buck2-remote-cache-proof:
    if: ${{ (!(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '')) && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      [
        'namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }};container.privileged=true;job.priority=1',
      ]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '0'
      CI_BUCK2_CACHE_EVIDENCE_PATH: '${{ github.workspace }}/tmp/buck2-cache-evidence.json'
      CI_BUCK2_CACHE_ACTIONS_PATH: '${{ github.workspace }}/tmp/buck2-cache-actions.jsonl.gz'
      CI_BUCK2_CACHE_WARM99_PATH: '${{ github.workspace }}/tmp/buck2-cache-warm99.json'
      CI_BUCK2_CACHE_PROOF_MANIFEST_PATH: '${{ github.workspace }}/tmp/buck2-cache-proof-manifest.json'
      CI_BUCK2_CACHE_EVIDENCE_START: '${{ github.workspace }}/tmp/buck2-cache-evidence-start'
      CI_BUCK2_CACHE_EVIDENCE_JOB: trusted-buck2-remote-cache-proof
      CI_BUCK2_CACHE_EVIDENCE_JOB_NAME: trusted-buck2-remote-cache-proof
      CI_BUCK2_CACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '0'
      CI_EVIDENCE_MODE: ${{ vars.CI_EVIDENCE_MODE }}
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - # v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare pipeline job identity
        shell: bash
        env:
          JOB_KEY: trusted-buck2-remote-cache-proof
          MATRIX_VALUE: ''
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash genie/ci-scripts/evidence-job.sh identity
      - name: Start Buck2 cache evidence window
        shell: bash
        run: |
          set -euo pipefail
          marker="${CI_BUCK2_CACHE_EVIDENCE_START:?cache evidence start not declared}"
          mkdir -p "${marker%/*}"
          started_at=$(( $(date +%s) * 1000 ))
          source_root=""
          fresh_root=0
          if source_root=$(cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}" && pwd -P); then
            if tracked_root=$(git -C "$source_root" rev-parse --show-toplevel 2>/dev/null) &&
               tracked_root=$(cd "$tracked_root" && pwd -P) &&
               [ "$tracked_root" = "$source_root" ] &&
               [ ! -e "$source_root/buck-out" ] && [ ! -L "$source_root/buck-out" ]; then
              fresh_root=1
            fi
          fi
          printf "%s\n%s\n%s\n" "$started_at" "$source_root" "$fresh_root" > "$marker"
          printf "CI_BUCK2_CACHE_EVIDENCE_STARTED_AT=%s\n" "$started_at" >> "$GITHUB_ENV"
      - # v3.24.1
        name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = 
            extra-trusted-public-keys = 
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
        timeout-minutes: ${{ runner.os == 'macOS' && 5 || 2 }}
      - name: Provide cachix CLI from nixpkgs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths nixpkgs#cachix)
          echo "$out/bin" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - # v17
        name: Enable Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: overeng-effect-utils
          skipPush: true
      - name: Prepare CI helper scripts
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && set -euo pipefail
          scripts_src='genie/ci-scripts'
          scripts_dst='${{ runner.temp }}/composition-state/ci-runtime'
          if [ ! -d "$scripts_src" ]; then
            echo "::error::CI helper script directory is missing: $scripts_src"
            exit 1
          fi
          rm -rf "$scripts_dst"
          mkdir -p "$scripts_dst"
          cp -R "$scripts_src/." "$scripts_dst/"
          rm -f "$scripts_dst"/*.genie.ts
          chmod +x "$scripts_dst"/*.sh
      - name: Use pinned devenv from lock
        run: |
          cd "${GITHUB_WORKSPACE:-$PWD}" && DEVENV_REV=$(jq -r .nodes.devenv.locked.rev 'devenv.lock')
          if [ -z "$DEVENV_REV" ] || [ "$DEVENV_REV" = "null" ]; then
            printf '::error::%s missing .nodes.devenv.locked.rev\n' 'devenv.lock'
            exit 1
          fi
          echo "DEVENV_REV=$DEVENV_REV" >> "$GITHUB_ENV"
          echo "Pinned devenv rev: $DEVENV_REV"
        shell: bash
      - name: Resolve devenv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __genie_ci_retry_script='${{ runner.temp }}/composition-state/ci-runtime/run-with-nix-gc-race-retry.sh'
          bash "$__genie_ci_retry_script" 'resolve devenv (devenv.lock)' 'cd "${GITHUB_WORKSPACE:-$PWD}" && '"'"'${{ runner.temp }}/composition-state/ci-runtime/resolve-devenv.sh'"'"' '"'"'devenv.lock'"'"''
        shell: bash
        timeout-minutes: ${{ runner.os == 'macOS' && 3 || 6 }}
      - name: Prove fresh-root remote action and test-cache hits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUCK2_PUBLIC_CACHE_WRITE_AUTH: ${{ secrets.BUCK2_PUBLIC_CACHE_WRITE_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${BUCK2_PUBLIC_CACHE_WRITE_AUTH:-}" ]; then
            echo "::error::BUCK2_PUBLIC_CACHE_WRITE_AUTH is required for the trusted remote-cache proof"
            exit 1
          fi
          # Buck sends the header verbatim; only the Base64 form reaches the daemon.
          BUCK2_CACHE_WRITE_BASIC_AUTH="$(printf '%s' "$BUCK2_PUBLIC_CACHE_WRITE_AUTH" | base64 | tr -d '\n')"
          echo "::add-mask::$BUCK2_CACHE_WRITE_BASIC_AUTH"
          export BUCK2_CACHE_WRITE_BASIC_AUTH
          unset BUCK2_PUBLIC_CACHE_WRITE_AUTH
          "${DEVENV_BIN:?DEVENV_BIN not set}" shell -- bash scripts/buck2-remote-cache-proof.sh
      - name: Collect Buck2 cache evidence
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${CI_SOURCE_ROOT:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE not set}}"
          nix shell .#bun .#buck2 --command bash genie/ci-scripts/collect-buck2-cache-evidence.sh
      - # v4.6.2
        name: Upload Buck2 cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'buck2-cache-evidence-trusted-buck2-remote-cache-proof-${{ github.run_attempt }}'
          path: |
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}
            ${{ env.CI_BUCK2_CACHE_ACTIONS_PATH }}
            ${{ env.CI_BUCK2_CACHE_WARM99_PATH }}
            ${{ env.CI_BUCK2_CACHE_PROOF_MANIFEST_PATH }}
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shard-index.json
            ${{ env.CI_BUCK2_CACHE_EVIDENCE_PATH }}.shards/*.json
          if-no-files-found: warn
          retention-days: 90
      - # v4.4.0
        if: ${{ always() && env.CI_EVIDENCE_MODE == 'upload' && env.PIPELINE_TRUSTED == 'true' && vars.TS_EVIDENCE_CLIENT_ID != '' && vars.TS_EVIDENCE_AUDIENCE != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_EVIDENCE_CLIENT_ID }}
          audience: ${{ vars.TS_EVIDENCE_AUDIENCE }}
          tags: 'tag:ci-buck2-evidence'
          args: --accept-dns=true
      - name: Export completed job trace
        if: ${{ always() }}
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: "bash genie/ci-scripts/evidence-job.sh export '${{ job.status }}' || true"
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-trusted-buck2-remote-cache-proof"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  pr-reviews-resolved:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - id: linux-nix-sandbox-policy
        name: Disable Linux Nix sandbox fallback
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'NIX_CONFIG<<EOF\n%s\nsandbox = true\nsandbox-fallback = false\nEOF\n' "${NIX_CONFIG:-}" >> "$GITHUB_ENV"
      - id: buck2-ci-job-instance
        name: Initialize Buck2 CI job instance
        shell: bash
        run: printf 'BUCK2_CI_JOB_INSTANCE=%s\n' "$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Check unresolved review threads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf '%s\n' '::notice::pr-reviews-resolved only gates pull requests; nothing to enforce.'
            exit 0
          fi
          pr_number="${{ github.event.pull_request.number }}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' '::error::pr-reviews-resolved could not determine the pull request number.'
            exit 1
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          query='query($owner:String!,$name:String!,$number:Int!,$cursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){pageInfo{hasNextPage endCursor}nodes{isResolved}}}}}'
          unresolved=0
          cursor=""
          page=0
          while :; do
            page=$((page + 1))
            if [ "$page" -gt 5 ]; then
              printf '%s\n' '::error::pr-reviews-resolved found more than 500 review threads; refusing to paginate further.'
              exit 1
            fi
            if [ -z "$cursor" ]; then
              page_json=$(gh api graphql -f query="$query" -f owner="$owner" -f name="$name" -F number="$pr_number")
            else
              page_json=$(gh api graphql -f query="$query" -f owner="$owner" -f name="$name" -F number="$pr_number" -f cursor="$cursor")
            fi
            page_unresolved=$(printf '%s\n' "$page_json" | jq '[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false)] | length')
            unresolved=$((unresolved + page_unresolved))
            if [ "$(printf '%s\n' "$page_json" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')" != "true" ]; then
              break
            fi
            cursor=$(printf '%s\n' "$page_json" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')
          done
          if [ "$unresolved" -gt 0 ]; then
            printf '%s\n' "::error::pr-reviews-resolved found $unresolved unresolved review thread(s); resolve them before merge, then re-run this check (thread resolution does not retrigger workflows)."
            exit 1
          fi
          printf '%s\n' "All review threads resolved on PR #$pr_number."
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '0'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      CI_BUCK2_CACHE_EVIDENCE_DISABLED: '1'
    concurrency:
      group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '' && format('measurement-baseline-{0}', inputs.measurement_baseline_ref) || (github.event_name == 'workflow_dispatch' && format('manual-run-{0}', github.run_id) || 'code') }}-pr-reviews-resolved"
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.measurement_baseline_ref != '') }}
  source-shape:
    runs-on:
      [
        "namespace-profile-linux-x86-64;github.run-id=${{ github.run_id }}${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ';container.privileged=true' || '' }};job.priority=1",
      ]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      FORCE_SETUP: '1'
      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      BUCK2_PUBLIC_CACHE_READ_ONLY: '1'
      CI_MEASUREMENT_SUBJECT_REF: ${{ inputs.measurement_baseline_ref || github.event.pull_request.head.ref || github.ref }}
      CI_MEASUREMENT_SUBJECT_SHA: ${{ inputs.measurement_baseline_ref || github.event.pull_request.head.sha || github.sha }}
