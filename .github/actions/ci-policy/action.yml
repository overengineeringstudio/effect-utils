name: CI workflow fleet policy
description: Enforce the shared Genie fleet policy against checked-in workflow YAML
inputs:
  repository-root:
    description: Checkout to inspect, relative to the workspace (or an absolute path)
    required: false
    default: .
  exceptions-file:
    description: Optional JSON exception registry, relative to repository-root
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check workflow fleet policy
      shell: /usr/bin/env -u BASH_ENV -u ENV PATH=/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:/usr/bin:/bin bash --noprofile --norc -p -eo pipefail {0}
      env:
        CI_POLICY_ACTION_PATH: ${{ github.action_path }}
        CI_POLICY_ROOT: ${{ inputs.repository-root }}
        CI_POLICY_EXCEPTIONS: ${{ inputs.exceptions-file }}
        CI_POLICY_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        trusted_path=/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:/usr/bin:/bin
        export PATH="$trusted_path"
        unset BASH_ENV ENV CDPATH
        if [[ -x /nix/var/nix/profiles/default/bin/nix ]]; then
          nix_bin=/nix/var/nix/profiles/default/bin/nix
        elif [[ -x /run/current-system/sw/bin/nix ]]; then
          nix_bin=/run/current-system/sw/bin/nix
        else
          echo 'A trusted fleet Nix installation is required' >&2
          exit 1
        fi
        runtime_home=$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP not set}/ci-policy.XXXXXX")
        trap 'rm -rf -- "$runtime_home"' EXIT
        mkdir "$runtime_home/tmp"
        policy_root=$(realpath "$CI_POLICY_ACTION_PATH/../../..")
        if [[ "$CI_POLICY_ROOT" = /* ]]; then
          consumer_root=$(realpath "$CI_POLICY_ROOT")
        else
          consumer_root=$(realpath "$GITHUB_WORKSPACE/$CI_POLICY_ROOT")
        fi
        # Keep Bun configuration discovery in the trusted, pinned action checkout.
        cd "$policy_root"
        # No consumer Nix configuration, runtime options, or user configuration
        # enters either bootstrap or validation. Only signed substitution is
        # permitted: compilation and remote builders remain disabled.
        bun_package=$(env -i HOME="$runtime_home" TMPDIR="$runtime_home/tmp" PATH="$trusted_path" \
          "$nix_bin" eval --impure --raw --file "$CI_POLICY_ACTION_PATH/bun-package.nix")
        bun_root=$(env -i HOME="$runtime_home" TMPDIR="$runtime_home/tmp" PATH="$trusted_path" \
          "$nix_bin" build --no-link --print-out-paths \
          --option builders '' --option max-jobs 0 "$bun_package")
        env -i HOME="$runtime_home" TMPDIR="$runtime_home/tmp" PATH="$trusted_path" \
          "$bun_root/bin/bun" "$policy_root/genie/ci-workflow/check-policy.ts" \
          "$consumer_root" "$CI_POLICY_REPOSITORY" "$CI_POLICY_EXCEPTIONS"
