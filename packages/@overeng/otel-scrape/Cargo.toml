[package]
name = "otel-scrape"
version = "0.0.0"
edition = "2021"
description = "Process wrapper for command telemetry and profile artifact links"
license = "MIT"

[lib]
name = "otel_scrape"
path = "src/lib.rs"

[[bin]]
name = "otel-scrape"
path = "src/main.rs"

[dependencies]
getrandom = "0.4"
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
