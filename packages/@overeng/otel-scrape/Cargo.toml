[package]
name = "otel-scrape"
version = "0.0.0"
edition = "2021"
description = "Process wrapper for command telemetry and profile artifact links"
license = "MIT"

[lib]
name = "otel_scrape"
path = "src/lib.rs"

[[bin]]
name = "otel-scrape"
path = "src/main.rs"

[dependencies]
# Registry-agnostic primitives (content-address CAS, W3C trace-context, hex /
# stable-hash) shared from otel-core. One-way dep: otel-scrape -> otel-core.
otel-core = { path = "../otel-core" }
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Integration tests (tests/cli.rs) recompute stable hashes to assert against the
# wrapper's summary output. sha2 is test-only now that the hashing helpers moved
# to otel-core; the src lane reaches them through otel-core, not this crate.
sha2 = "0.11"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
