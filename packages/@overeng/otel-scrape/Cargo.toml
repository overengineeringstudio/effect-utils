[package]
name = "otel-scrape"
workspace = "../../../rust"
version.workspace = true
edition.workspace = true
description = "Process wrapper for command telemetry and profile artifact links"
license.workspace = true

[lib]
name = "otel_scrape"
path = "src/lib.rs"

[[bin]]
name = "otel-scrape"
path = "src/main.rs"

[dependencies]
getrandom = "0.4"
# Exact pin is intentionally package-local; otelite's target-conditioned libc
# request uses Cargo's compatible range and therefore has different semantics.
libc = "=0.2.186"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"

[dev-dependencies]
tempfile.workspace = true
