[package]
name = "otelite"
workspace = "../../../rust"
version.workspace = true
edition.workspace = true
description = "Local OTLP capture tool for E2E and instrumentation tests"
license.workspace = true

[lib]
name = "otelite"
path = "src/lib.rs"

[[bin]]
name = "otelite"
path = "src/main.rs"

[dependencies]
# Tokio runtime shared by the HTTP (axum/hyper) and gRPC (tonic) receivers.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "process",
  "signal",
  "sync",
  "fs",
  "io-util",
] }
axum = "0.7"
tonic = "0.12"
prost = "0.13"
serde.workspace = true
serde_json.workspace = true
# opentelemetry-proto provides the message types, canonical OTLP/JSON serde,
# protobuf decode, AND the generated tonic server traits + *Server adapters.
opentelemetry-proto = { version = "0.27", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
  "logs",
  "with-serde",
] }

# Non-blocking fd setup for cancel-safe stdin-EOF stop (capture). Already in the
# tree transitively; pinned here as a direct dep.
[target.'cfg(unix)'.dependencies]
# This target-conditioned compatible request intentionally remains local; it
# is not semantically equivalent to otel-scrape's exact libc pin.
libc = "0.2.186"

[dev-dependencies]
# Test-only OTLP clients driving the receiver end-to-end (no mocks).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile.workspace = true
# Property-based tests for the derivation/summarize invariants (tests/properties.rs).
proptest = "1"
