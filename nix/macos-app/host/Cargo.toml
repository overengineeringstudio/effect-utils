[package]
name = "macos-app-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
test-signing-cert = []

[[bin]]
name = "macos-app-launchd-smoke"
path = "src/bin/macos-app-launchd-smoke.rs"
required-features = ["test-signing-cert"]

[dependencies]
libc = "0.2.177"
regex = "1.11.3"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
