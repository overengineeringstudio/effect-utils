packages:
  - app

overrides:
  '@overeng/utils': file:.devenv/pnpm-source-inputs/current/repos/effect-utils/packages/@overeng/utils
  '@overeng/genie': file:.devenv/pnpm-source-inputs/current/repos/effect-utils/packages/@overeng/genie

packageExtensions:
  fixture@1:
    dependencies:
      '@overeng/genie': file:.devenv/pnpm-source-inputs/current/repos/effect-utils/packages/@overeng/genie

packageExtensions:
  fixture-package@1.0.0:
    dependencies:
      '@overeng/utils': file:.devenv/pnpm-source-inputs/current/repos/effect-utils/packages/@overeng/utils

enableGlobalVirtualStore: true
globalVirtualStoreDir: .devenv/pnpm-gvs
storeDir: .devenv/pnpm-store-pure-v1
virtualStoreDir: node_modules/.pnpm
stateDir: .devenv/pnpm-state
cacheDir: .devenv/pnpm-cache
packageImportMethod: clone
nodeLinker: isolated
optimisticRepeatInstall: true
verifyDepsBeforeRun: install
sideEffectsCache: false
sideEffectsCacheReadonly: false
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
pmOnFail: ignore
