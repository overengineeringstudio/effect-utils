[package]
name = "macos-permissions-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
macos-app-security = { package = "macos-app-host", path = "../../macos-app/host" }

[dev-dependencies]
proptest = "1"
