# Fixups are imported from facebook/buck2 commit
# cea8779ac53be18b5293159ef065d8b83662bccd.
manifest_path = "Cargo.toml"
third_party_dir = "third-party"
precise_srcs = true
license_patterns = ["LICENSE*", "COPYING*", "UNLICENSE*"]
include_top_level = false
unresolved_fixup_error = true

[vendor]
gitignore_checksum_exclude = [".gitignore"]
checksum_exclude = []

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = false

[platform.macos-arm64]
target = "aarch64-apple-darwin"
execution-platform = false

[cargo]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
cxx_library = "cargo.cxx_library"
prebuilt_cxx_library = "cargo.prebuilt_cxx_library"
buildscript_genrule = "buildscript_run"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""

generated_file_header = """
# @generated by Reindeer from rust/Cargo.toml and rust/Cargo.lock.
# Do not edit by hand.
"""
