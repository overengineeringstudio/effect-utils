manifest_path = "Cargo.toml"
third_party_dir = "third-party"
precise_srcs = true
include_top_level = false
unresolved_fixup_error = true
cargo_env = false
vendor = false

[platform.x86_64-linux]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.x86_64-linux-musl]
target = "x86_64-unknown-linux-musl"
execution-platform = false

[buck]
file_name = "BUCK"
split = false
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
generated_file_header = """
##
## GENERATED FILE - DO NOT EDIT. Generated by Reindeer 2026.05.04.00.
## Sources: rust/Cargo.toml, rust/Cargo.lock, rust/reindeer.toml, rust/third-party/fixups/**
## Regenerate: devenv tasks run buck2:rust-deps:generate
##
"""
buckfile_imports = """
load("@prelude//rust:cargo_package.bzl", "cargo")
load("//rust:reindeer.bzl", "reindeer_buildscript_run")
"""
buildscript_genrule = "reindeer_buildscript_run"
