[workspace]
resolver = "2"
members = [
  "../packages/@overeng/otel-scrape",
  "../packages/@overeng/otelite",
  "buck2-tools/archive-tool",
  "buck2-tools/core",
  "buck2-tools/events",
  "buck2-tools/product",
  "effect-rust-fixtures/hash-core",
  "effect-rust-fixtures/math-core",
  "effect-rust-fixtures/wasm-adapter",
  "effect-rust-fixtures/napi-adapter",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# Request templates are inherited only where the member semantics match.
# Each member still owns whether, where, and with which dependency kind it uses
# the request. Package-local requests remain explicit exceptions.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
# Exact match with the hub's wasm-bindgen-cli toolchain.
wasm-bindgen = "=0.2.127"
napi = { version = "=3.13.0", default-features = false, features = ["napi4"] }
napi-derive = "=3.6.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
# Node-API converts panics at the FFI boundary; abort would bypass reclamation.
panic = "unwind"
