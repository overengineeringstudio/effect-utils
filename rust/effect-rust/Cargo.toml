[package]
name = "effect-rust"
workspace = ".."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
wasm = ["dep:js-sys", "dep:wasm-bindgen"]
napi = ["dep:napi"]
# Rust-owned contracts: schemars schemas with the effect-rust vocabulary and
# the `#[effect_rust::contract]` attribute. Required by exports with serde domain types.
contract = ["dep:schemars", "dep:regex"]

[dependencies]
borsh.workspace = true
chrono.workspace = true
effect-rust-macros = { path = "../effect-rust-macros" }
regex = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
serde_path_to_error.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { workspace = true, optional = true, features = ["napi6"] }
